apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blockverse-ingress
  namespace: blockverse
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # SSL via cert-manager (free Let's Encrypt)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # WebSocket support
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Force HTTPS redirect
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Max upload body size
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  tls:
    - hosts:
        - "blockverse.yourdomain.com"
      secretName: blockverse-tls
  rules:
    - host: "blockverse.yourdomain.com"
      http:
        paths:
          # Route WebSocket traffic to backend
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: blockverse-backend
                port:
                  number: 8080
                  
          # Route API traffic to backend
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: blockverse-backend
                port:
                  number: 8080
                  
          # Route all other traffic to frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blockverse-frontend
                port:
                  number: 3000
