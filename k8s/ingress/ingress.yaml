apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blockverse-ingress
  namespace: blockverse
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # WebSocket support
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Max upload body size
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  rules:
    - http:
        paths:
          # WebSocket traffic to backend
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: blockverse-backend
                port:
                  number: 8080

          # API traffic to backend
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: blockverse-backend
                port:
                  number: 8080

          # All other traffic to frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blockverse-frontend
                port:
                  number: 3000
