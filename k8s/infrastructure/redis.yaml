apiVersion: v1
kind: Service
metadata:
  name: blockverse-redis
  namespace: blockverse
  labels:
    app: blockverse-redis
spec:
  ports:
    - port: 6379
      name: redis
  selector:
    app: blockverse-redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: blockverse-redis
  namespace: blockverse
spec:
  serviceName: "blockverse-redis"
  replicas: 1
  selector:
    matchLabels:
      app: blockverse-redis
  template:
    metadata:
      labels:
        app: blockverse-redis
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          command:
            - "sh"
            - "-c"
            - "redis-server --requirepass $(REDIS_PASSWORD) --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru"
          ports:
            - containerPort: 6379
              name: redis
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: blockverse-secrets
                  key: redis-password
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          volumeMounts:
            - name: redis-persistent-storage
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-persistent-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
