apiVersion: v1
kind: Service
metadata:
  name: blockverse-kafka
  namespace: blockverse
  labels:
    app: blockverse-kafka
spec:
  ports:
    - port: 9092
      targetPort: 9092
      name: kafka
  selector:
    app: blockverse-kafka
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockverse-kafka
  namespace: blockverse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blockverse-kafka
  template:
    metadata:
      labels:
        app: blockverse-kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.6.1
          ports:
            - containerPort: 9092
              name: kafka
            - containerPort: 9093
              name: controller
          env:
            # KRaft Mode Configurations (No Zookeeper!)
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@127.0.0.1:9093"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://blockverse-kafka:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_CLUSTER_ID
              value: "4L62xOb2TGWmqsIlxTRQZQ"
            - name: CLUSTER_ID
              value: "4L62xOb2TGWmqsIlxTRQZQ"
            
            # Cost-Optimized Resource Tunings
            - name: KAFKA_JVM_PERFORMANCE_OPTS
              value: "-Xms256M -Xmx512M -XX:+UseG1GC"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "24" # Reduce retention to save disk space
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

