# ── 1-setup.yaml ──────────────────────────────────────────────────────────────
# Creates the namespace, service account, and config.
# Apply this FIRST before anything else.
#
# NOTE: Secrets are in k8s/secrets.yaml (gitignored — do NOT commit that file).
# ──────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: Namespace
metadata:
  name: blockverse

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: blockverse-backend-sa
  namespace: blockverse
  # The EC2 instance profile grants S3 and ECR permissions automatically.

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: blockverse-config
  namespace: blockverse
data:
  # Database
  DB_HOST: "blockverse-production-mysql.ch2uwg2a80dc.ap-south-1.rds.amazonaws.com"
  DB_PORT: "3306"
  DB_NAME: "blockverse"
  DB_USER: "dbadmin"

  # Redis
  SPRING_DATA_REDIS_HOST: "blockverse-redis"
  SPRING_DATA_REDIS_PORT: "6379"

  # Kafka
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "blockverse-kafka:9092"

  # AWS
  AWS_REGION: "ap-south-1"
  AWS_S3_BUCKET: "blockverse-production-assets-bucket-yjpr1x6d"

  # Frontend public URLs
  NEXT_PUBLIC_API_BASE_URL: "http://65.0.171.134"
  NEXT_PUBLIC_WS_URL: "ws://65.0.171.134/ws"

  SPRING_PROFILES_ACTIVE: "prod"
