apiVersion: v1
kind: Service
metadata:
  name: blockverse-backend
  namespace: blockverse
  labels:
    app: blockverse-backend
    tier: backend
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: blockverse-backend
    tier: backend
