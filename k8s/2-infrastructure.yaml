# Redis (cache) and Kafka (message broker) — applied after setup.

# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: blockverse-redis
  namespace: blockverse
spec:
  ports:
    - port: 6379
  selector:
    app: blockverse-redis

---

# Redis StatefulSet (data is persisted to a 1Gi volume)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: blockverse-redis
  namespace: blockverse
spec:
  serviceName: "blockverse-redis"
  replicas: 1
  selector:
    matchLabels:
      app: blockverse-redis
  template:
    metadata:
      labels:
        app: blockverse-redis
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          command:
            - "sh"
            - "-c"
            - "redis-server --requirepass $(REDIS_PASSWORD) --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru"
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: blockverse-secrets
                  key: redis-password
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

---

# Kafka Service
apiVersion: v1
kind: Service
metadata:
  name: blockverse-kafka
  namespace: blockverse
spec:
  ports:
    - port: 9092
      name: kafka
  selector:
    app: blockverse-kafka

---

# Kafka Deployment (KRaft mode — no Zookeeper needed)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockverse-kafka
  namespace: blockverse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blockverse-kafka
  template:
    metadata:
      labels:
        app: blockverse-kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.6.1
          ports:
            - containerPort: 9092
            - containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@127.0.0.1:9093"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://blockverse-kafka:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_CLUSTER_ID
              value: "4L62xOb2TGWmqsIlxTRQZQ"
            - name: CLUSTER_ID
              value: "4L62xOb2TGWmqsIlxTRQZQ"
            - name: KAFKA_JVM_PERFORMANCE_OPTS
              value: "-Xms256M -Xmx512M -XX:+UseG1GC"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "24"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
