# Spring Boot backend — Deployment, Service, and HPA.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockverse-backend
  namespace: blockverse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blockverse-backend
      tier: backend
  template:
    metadata:
      labels:
        app: blockverse-backend
        tier: backend
    spec:
      serviceAccountName: blockverse-backend-sa
      containers:
        - name: backend
          image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/blockverse-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "384Mi"
              cpu: "250m"
            limits:
              memory: "768Mi"
              cpu: "750m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 2
          env:
            # Database
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: blockverse-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: blockverse-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: blockverse-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: blockverse-config
                  key: DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: blockverse-secrets
                  key: db-password
            # Redis
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: blockverse-config
                  key: SPRING_DATA_REDIS_HOST
            - name: SPRING_DATA_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: blockverse-config
                  key: SPRING_DATA_REDIS_PORT
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: blockverse-secrets
                  key: redis-password
            # Kafka
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: blockverse-config
                  key: SPRING_KAFKA_BOOTSTRAP_SERVERS
            # JWT
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: blockverse-secrets
                  key: jwt-secret
            # AWS S3
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: blockverse-config
                  key: AWS_REGION
            - name: AWS_S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: blockverse-config
                  key: AWS_S3_BUCKET
            # Spring Profile
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: blockverse-config
                  key: SPRING_PROFILES_ACTIVE

---

apiVersion: v1
kind: Service
metadata:
  name: blockverse-backend
  namespace: blockverse
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: blockverse-backend

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: blockverse-backend-hpa
  namespace: blockverse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: blockverse-backend
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
