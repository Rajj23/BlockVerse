apiVersion: v1
kind: Service
metadata:
  name: blockverse-frontend
  namespace: blockverse
  labels:
    app: blockverse-frontend
    tier: frontend
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: blockverse-frontend
    tier: frontend
