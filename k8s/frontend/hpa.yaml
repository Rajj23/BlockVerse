apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: blockverse-frontend-hpa
  namespace: blockverse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: blockverse-frontend
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
