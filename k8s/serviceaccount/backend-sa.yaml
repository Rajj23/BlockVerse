apiVersion: v1
kind: ServiceAccount
metadata:
  name: blockverse-backend-sa
  namespace: blockverse
  annotations:
    # NOTE: Under k3s on EC2, IRSA (IAM Roles for Service Accounts) is not used.
    # The pods automatically inherit S3, ECR, and Secrets Manager permissions from the EC2 Instance Profile (iam.tf).
    # Keep this commented out for reference if you ever migrate back to EKS.
    # eks.amazonaws.com/role-arn: arn:aws:iam::YOUR_AWS_ACCOUNT_ID:role/blockverse-production-irsa-backend-role

