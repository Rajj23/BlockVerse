version: '3.9'

networks:
  blockverse-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  zookeeper-data:
  zookeeper-log:
  kafka-data:

services:

  mysql:
    image: mysql:8.3
    container_name: blockverse-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE:      ${DB_NAME:-blockverse}
      MYSQL_USER:          ${DB_USER:-blockverse}
      MYSQL_PASSWORD:      ${DB_PASS:-blockverse}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - blockverse-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    container_name: blockverse-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD:-redispassword}
        --appendonly yes
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - blockverse-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: blockverse-zookeeper
    restart: unless-stopped
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
      ZOOKEEPER_SYNC_LIMIT:  2
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    networks:
      - blockverse-net
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: blockverse-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
      - "29092:29092"
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID:                                1
      KAFKA_ZOOKEEPER_CONNECT:                        zookeeper:2181
      KAFKA_LISTENERS:                                PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS:                     PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:           PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME:               INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:         1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:            1
      KAFKA_LOG_RETENTION_HOURS:                      168
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:                "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - blockverse-net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: blockverse-backend:latest
    container_name: blockverse-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-blockverse}
      DB_USER: ${DB_USER:-blockverse}
      DB_PASS: ${DB_PASS:-blockverse}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST:         redis
      SPRING_DATA_REDIS_PORT:         6379
      SPRING_DATA_REDIS_PASSWORD:     ${REDIS_PASSWORD:-redispassword}
      JWT_SECRET:                     ${JWT_SECRET}
      AWS_ACCESS_KEY_ID:              ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY:          ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION:                     ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET:                  ${AWS_S3_BUCKET:-}
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    networks:
      - blockverse-net
    healthcheck:
      test: ["CMD-SHELL",
             "curl -sf http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: blockverse-frontend:latest
    container_name: blockverse-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV:                 production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://backend:8080}
      NEXT_PUBLIC_WS_URL:       ${NEXT_PUBLIC_WS_URL:-http://backend:8080/ws}
    networks:
      - blockverse-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: blockverse-kafka-ui
    restart: unless-stopped
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    depends_on:
      kafka:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME:             blockverse
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER:        zookeeper:2181
      DYNAMIC_CONFIG_ENABLED:            "true"
    networks:
      - blockverse-net
    profiles:
      - tools

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: blockverse-redis-commander
    restart: unless-stopped
    ports:
      - "${REDIS_COMMANDER_PORT:-8085}:8081"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOSTS:   local:redis:6379:0:${REDIS_PASSWORD:-redispassword}
      HTTP_USER:     ${REDIS_COMMANDER_USER:-admin}
      HTTP_PASSWORD: ${REDIS_COMMANDER_PASS:-admin}
    networks:
      - blockverse-net
    profiles:
      - tools
