logging.level.org.springframework.boot.context.config=DEBUG
spring.application.name=BlockVerse
spring.config.import=optional:classpath:application-secrets.properties

jwt.refreshTokenValidity=604800000
jwt.accessTokenValidity=900000

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true

# Consumer
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=true

app.kafka.topic.notification=notification-topic
app.kafka.topic.bulk-notification=bulk-notification-topic

jwt.secret=${JWT_SECRET}

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# Show SQL (optional)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=BlockVerse
info.app.version=1.0.0

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}

# AWS S3 Integration with Environment Variable overrides
aws.access-key=${AWS_ACCESS_KEY_ID:${aws.access-key:}}
aws.secret-key=${AWS_SECRET_ACCESS_KEY:${aws.secret-key:}}
aws.region=${AWS_REGION:${aws.region:ap-south-1}}
aws.s3.bucket=${AWS_S3_BUCKET:${aws.s3.bucket:}}