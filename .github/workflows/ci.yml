name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ap-south-1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Job 1: Backend — Build & Test ──────────────────────────────────────────
  backend-ci:
    name: 🔧 Backend — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build & run tests
        run: ./mvnw verify -B -Dspring.profiles.active=test
        env:
          JAVA_TOOL_OPTIONS: "--enable-preview"
          JWT_SECRET: "ci-test-secret-key-must-be-at-least-64-characters-long-for-HS512-algo!!"
          AWS_ACCESS_KEY_ID: "dummy"
          AWS_SECRET_ACCESS_KEY: "dummy"
          AWS_REGION: "us-east-1"
          AWS_S3_BUCKET: "dummy-bucket"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  # ── Job 2: Frontend — Type Check & Build ───────────────────────────────────
  frontend-ci:
    name: 🎨 Frontend — Type Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Clean Windows package-lock.json
        run: rm -f package-lock.json

      - name: Install dependencies
        run: npm install

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
          NEXT_PUBLIC_WS_URL: http://localhost:8080/ws

  # ── Job 3: Build & Push to Amazon ECR ─────────────────────────────────────
  # Only runs on push to main (not on pull requests)
  ecr-push:
    name: 🐳 ECR — Build & Push Container Images
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: docker/backend/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/blockverse-backend:latest
            ${{ steps.login-ecr.outputs.registry }}/blockverse-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: docker/frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/blockverse-frontend:latest
            ${{ steps.login-ecr.outputs.registry }}/blockverse-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 4: Deploy to k3s on EC2 ────────────────────────────────────────────
  # SSHs into EC2 and rolls out the newly-pushed images.
  # Requires GitHub Secrets:
  #   EC2_HOST            → <your-ec2-public-ip> (EC2 public IP / Elastic IP)
  #   EC2_USER            → ubuntu
  #   EC2_SSH_PRIVATE_KEY → contents of your SSH private key
  deploy:
    name: 🚀 Deploy — Rollout to k3s
    needs: [ecr-push]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy new images to k3s via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          timeout: 120s
          # Use sudo + explicit KUBECONFIG since ubuntu user lacks direct kubeconfig access
          script: |
            set -e
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            echo "🔄 Rolling out new backend image..."
            sudo kubectl rollout restart deployment/blockverse-backend -n blockverse

            echo "🔄 Rolling out new frontend image..."
            sudo kubectl rollout restart deployment/blockverse-frontend -n blockverse

            echo "⏳ Waiting for backend rollout to complete..."
            sudo kubectl rollout status deployment/blockverse-backend -n blockverse --timeout=180s

            echo "⏳ Waiting for frontend rollout to complete..."
            sudo kubectl rollout status deployment/blockverse-frontend -n blockverse --timeout=180s

            echo "✅ Deployment complete!"
            echo ""
            echo "── Pod Status ──────────────────────────────────"
            sudo kubectl get pods -n blockverse -o wide
